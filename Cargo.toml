[package]
name = "cw-multi-test"
version = "3.0.0-rc"
authors = [
    "Ethan Frey <ethanfrey@users.noreply.github.com>",
    "Dariusz Depta <depta@engos.de>",
]
description = "Testing tools for multi-contract interactions"
repository = "https://github.com/CosmWasm/cw-multi-test"
homepage = "https://cosmwasm.com"
license = "Apache-2.0"
edition = "2021"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["staking", "stargate", "cosmwasm_3_0"]
staking = ["cosmwasm-std/staking"]
stargate = ["cosmwasm-std/stargate"]
cosmwasm_1_1 = ["cosmwasm-std/cosmwasm_1_1"]
cosmwasm_1_2 = ["cosmwasm_1_1", "cosmwasm-std/cosmwasm_1_2"]
cosmwasm_1_3 = ["cosmwasm_1_2", "cosmwasm-std/cosmwasm_1_3"]
cosmwasm_1_4 = ["cosmwasm_1_3", "cosmwasm-std/cosmwasm_1_4"]
cosmwasm_2_0 = ["cosmwasm_1_4", "cosmwasm-std/cosmwasm_2_0"]
cosmwasm_2_1 = ["cosmwasm_2_0", "cosmwasm-std/cosmwasm_2_1"]
cosmwasm_2_2 = ["cosmwasm_2_1", "cosmwasm-std/cosmwasm_2_2"]
cosmwasm_3_0 = ["cosmwasm_2_2", "cosmwasm-std/cosmwasm_3_0"]

[dependencies]
anyhow = "1.0.89"
bech32 = "0.11.0"
cosmos_sdk_proto = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cosmos-rust", branch = "v3.1.0-zk.0", package = "cosmos-sdk-proto", package = "cosmos-sdk-proto" }
cosmwasm-schema = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cosmwasm", branch = "v3.1.0-zk.0", package = "cosmwasm-schema" }
cosmwasm-std = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cosmwasm", branch = "v3.1.0-zk.0", package = "cosmwasm-std" }
cw-storage-plus = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cw-storage-plus", branch = "v3.1.0-zk.0" }
cw-utils = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cw-minus", branch = "main", package = "cw-utils" }
derivative = "2.2.0"
hex = "0.4.3"
itertools = "0.13.0"
log = "0.4.20"
prost = "0.14.1"
schemars = "0.8.4"
serde = "1.0.210"
serde_json = "1.0.40"
sha2 = "0.10.8"
thiserror = "1.0.64"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
tokio   = { version = "1.39.0" }
tonic   = { version = "0.14.1", default-features = false }

## Emulation
cosmwasm-vm = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cosmwasm", branch = "v3.1.0-zk.0", package = "cosmwasm-vm", features = ["iterator", "staking", "stargate"] }

## Dual Storage
cosmrs = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cosmos-rust", branch = "v3.1.0-zk.0", package = "cosmrs" }
cw-orch = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cw-orchestrator", branch = "product/cw3", package = "cw-orch", features = ["daemon"] }
cw20-ics20 = { path = "../cw-plus/contracts/cw20-ics20" }
num-bigint = "0.4.3"

# Analyzer

rustc-serialize = "0.3.24"
treediff = { version = "4.0.2", features = ["with-rustc-serialize"] }
wasmer = { version = "=5.0.6", default-features = false, features = [
    "cranelift",
    "singlepass",
] }

# Caching
cargo_metadata = "0.18" # For finding Cargo target dir
file-lock = "2.1"

[dev-dependencies]
rustls = { version = "0.23", features = ["ring"] }
ctor = "0.2"
# general
env_logger = "0.10.0"
hex = "0.4.3"
hex-literal = "0.4.1"
once_cell = "1.20.2"
 
# Cavern Test App
cw2 = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cw-minus", branch = "main", package = "cw2" }
cw20 = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cw-plus", branch = "v3.1.0-zk.0", package = "cw20" }
# moneymarket = { git = "https://github.com/CavernPerson/money-market-contracts" }
