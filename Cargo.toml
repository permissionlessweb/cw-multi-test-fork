[package]
name = "abstract-cw-multi-test"
version = "3.0.0-rc"
authors = [
    "Ethan Frey <ethanfrey@users.noreply.github.com>",
    "Dariusz Depta <depta@engos.de>",
]
description = "Testing tools for multi-contract interactions"
repository = "https://github.com/CosmWasm/cw-multi-test"
homepage = "https://cosmwasm.com"
license = "Apache-2.0"
edition = "2021"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["staking", "stargate", "cosmwasm_3_0"]
staking = ["cosmwasm-std/staking"]
stargate = ["cosmwasm-std/stargate"]
cosmwasm_1_1 = ["cosmwasm-std/cosmwasm_1_1"]
cosmwasm_1_2 = ["cosmwasm_1_1", "cosmwasm-std/cosmwasm_1_2"]
cosmwasm_1_3 = ["cosmwasm_1_2", "cosmwasm-std/cosmwasm_1_3"]
cosmwasm_1_4 = ["cosmwasm_1_3", "cosmwasm-std/cosmwasm_1_4"]
cosmwasm_2_0 = ["cosmwasm_1_4", "cosmwasm-std/cosmwasm_2_0"]
cosmwasm_2_1 = ["cosmwasm_2_0", "cosmwasm-std/cosmwasm_2_1"]
cosmwasm_2_2 = ["cosmwasm_2_1", "cosmwasm-std/cosmwasm_2_2"]
cosmwasm_3_0 = ["cosmwasm_2_2", "cosmwasm-std/cosmwasm_3_0"]

[dependencies]
bech32 = "0.11.0"
cosmwasm-schema = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cosmwasm", branch = "v3.1.0-zk.0", package = "cosmwasm-schema" }
cosmwasm-std = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cosmwasm", branch = "v3.1.0-zk.0", package = "cosmwasm-std" }
cw-storage-plus = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cw-storage-plus", branch = "v3.1.0-zk.0" }
cw-utils = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cw-minus", branch = "main", package = "cw-utils" }
cw20-ics20 = { git = "ssh://returniflost@groot-wan/Users/returniflost/abstract/terp-core/crates/cw-plus", branch = "v3.1.0-zk.0", package = "cw20-ics20" }
itertools = "0.14.0"
prost = "0.14.1"
schemars = "0.8"
serde = "1.0.219"
sha2 = "0.10.9"
thiserror = "1.0.64"

hex = "0.4.3"
log = "0.4.20"
serde_json = "1.0.140"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }

[dev-dependencies]
cw-multi-test = { package = "abstract-cw-multi-test", path = "." }
hex = "0.4.3"
hex-literal = "0.4.1"
once_cell = "1.20.2"
