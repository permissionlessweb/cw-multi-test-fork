[package]
name = "cw-multi-test"
version = "3.0.0-rc"
authors = [
    "Ethan Frey <ethanfrey@users.noreply.github.com>",
    "Dariusz Depta <depta@engos.de>",
]
description = "Testing tools for multi-contract interactions"
repository = "https://github.com/CosmWasm/cw-multi-test"
homepage = "https://cosmwasm.com"
license = "Apache-2.0"
edition = "2021"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["staking", "stargate", "cosmwasm_3_0"]
staking = ["cosmwasm-std/staking"]
stargate = ["cosmwasm-std/stargate"]
cosmwasm_1_1 = ["cosmwasm-std/cosmwasm_1_1"]
cosmwasm_1_2 = ["cosmwasm_1_1", "cosmwasm-std/cosmwasm_1_2"]
cosmwasm_1_3 = ["cosmwasm_1_2", "cosmwasm-std/cosmwasm_1_3"]
cosmwasm_1_4 = ["cosmwasm_1_3", "cosmwasm-std/cosmwasm_1_4"]
cosmwasm_2_0 = ["cosmwasm_1_4", "cosmwasm-std/cosmwasm_2_0"]
cosmwasm_2_1 = ["cosmwasm_2_0", "cosmwasm-std/cosmwasm_2_1"]
cosmwasm_2_2 = ["cosmwasm_2_1", "cosmwasm-std/cosmwasm_2_2"]
cosmwasm_3_0 = ["cosmwasm_2_2", "cosmwasm-std/cosmwasm_3_0"]

[dependencies]
anyhow = "1.0.89"
bech32 = "0.11.0"
cosmos_sdk_proto = { package = "cosmos-sdk-proto", version = "0.28.0" }
cosmwasm-schema = { package = "cosmwasm-schema", version = "=4.1.0" }
cosmwasm-std = { package = "cosmwasm-std", version = "=4.1.0" }
cw-storage-plus = { version = "3.0.1" }
cw-utils = { package = "cw-utils", version = "3.0.0" }
derivative = "2.2.0"
hex = "0.4.3"
itertools = "0.13.0"
log = "0.4.20"
prost = "0.14.1"
schemars = "0.8.4"
serde = "1.0.210"
serde_json = "1.0.40"
sha2 = "0.10.8"
thiserror = "1.0.64"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
tokio   = { version = "1.39.0" }
tonic   = { version = "0.14.1", default-features = false }

## Emulation
cosmwasm-vm = { path = "../cosmwasm/packages/vm", package = "cosmwasm-vm", features = ["iterator", "staking", "stargate"] }

## Dual Storage
cosmrs = { package = "cosmrs", version = "0.23.0" }
cw-orch = { package = "cw-orch", version = "0.30.0", features = ["daemon"] }
cw20-ics20 = { version = "3.0.0" }
num-bigint = "0.4.3"
# Analyzer

rustc-serialize = "0.3.24"
treediff = { version = "4.0.2", features = ["with-rustc-serialize"] }
wasmer = { version = "=7.5.0", default-features = false, features = [
    "singlepass",
] }

# Caching
cargo_metadata = "0.18" # For finding Cargo target dir
file-lock = "2.1"

[dev-dependencies]
ctor = "0.2"
# general
env_logger = "0.10.0"
hex = "0.4.3"
hex-literal = "0.4.1"
once_cell = "1.20.2"
rustls = { version = "0.23", features = ["ring"] }
 
# Cavern Test App
cw2 = { package = "cw2", version = "3.0.0" }
cw20 = { package = "cw20", version = "3.0.0" }
# moneymarket = { git = "https://github.com/CavernPerson/money-market-contracts" }

[patch.crates-io]

cosmwasm-schema = { path = "../cosmwasm/packages/schema" }
cosmwasm-std = { path = "../cosmwasm/packages/std" }
cosmwasm-schema-derive = { path = "../cosmwasm/packages/schema-derive" }
cosmwasm-core = { path = "../cosmwasm/packages/core" }
cosmwasm-crypto = { path = "../cosmwasm/packages/crypto" }
cosmwasm-derive = { path = "../cosmwasm/packages/derive" }
cosmwasm-vm = { path = "../cosmwasm/packages/vm" }
cw-schema = { path = "../cosmwasm/packages/cw-schema" }
cw-schema-derive = { path = "../cosmwasm/packages/cw-schema-derive" }
zakura-halo2-gadgets = { path = "../zakura-common/crates/halo2_gadgets" }
zakura-halo2-poseidon = { path = "../zakura-common/crates/halo2_poseidon" }
zakura-halo2-proofs = { path = "../zakura-common/crates/halo2_proofs" }
zakura-pasta-curves = { path = "../zakura-common/crates/pasta_curves" }
zakura-reddsa = { path = "../zakura-common/crates/reddsa" }
wasmer-compiler-singlepass = { git = "https://github.com/permissionlessweb/wasmer", rev = "e1edbf4ff55b0e0ccb61015ee1015d8283689fd5" }
cosmos-sdk-proto = { git = "https://github.com/permissionlessweb/cosmos-rust", rev = "877ee79b693760f7ffa97ef542f5788c26f537dd" }
cosmrs = { git = "https://github.com/permissionlessweb/cosmos-rust", rev = "877ee79b693760f7ffa97ef542f5788c26f537dd" }
cw-orch = { git = "https://github.com/permissionlessweb/cw-orchestrator", rev = "99f8a568fe733735579b891c1dc47c97e4c8960d" }
cw-storage-plus = { git = "https://github.com/permissionlessweb/cw-storage-plus", rev = "b303f445113c95427b57fc825bc033fdf3e6fee0" }
cw-utils = { git = "https://github.com/permissionlessweb/cw-minus", rev = "14194672e846a56e5a37a4a3b449e375f6f2b496" }
cw2 = { git = "https://github.com/permissionlessweb/cw-minus", rev = "14194672e846a56e5a37a4a3b449e375f6f2b496" }
cw20 = { git = "https://github.com/permissionlessweb/cw-plus", rev = "f66883649c08d2671cc7d66cdf4f7f6abec4e44d" }
cw20-ics20 = { git = "https://github.com/permissionlessweb/cw-plus", rev = "f66883649c08d2671cc7d66cdf4f7f6abec4e44d" }
