[package]
name = "clone-cw-multi-test"
version = "3.0.1"
authors = [
    "Ethan Frey <ethanfrey@users.noreply.github.com>",
    "Dariusz Depta <depta@engos.de>",
]
description = "Testing tools for multi-contract interactions"
repository = "https://github.com/CosmWasm/cw-multi-test"
homepage = "https://cosmwasm.com"
license = "Apache-2.0"
edition = "2021"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["staking", "stargate", "cosmwasm_3_0"]
staking = ["cosmwasm-std/staking"]
stargate = ["cosmwasm-std/stargate"]
cosmwasm_1_1 = ["cosmwasm-std/cosmwasm_1_1"]
cosmwasm_1_2 = ["cosmwasm_1_1", "cosmwasm-std/cosmwasm_1_2"]
cosmwasm_1_3 = ["cosmwasm_1_2", "cosmwasm-std/cosmwasm_1_3"]
cosmwasm_1_4 = ["cosmwasm_1_3", "cosmwasm-std/cosmwasm_1_4"]
cosmwasm_2_0 = ["cosmwasm_1_4", "cosmwasm-std/cosmwasm_2_0"]
cosmwasm_2_1 = ["cosmwasm_2_0", "cosmwasm-std/cosmwasm_2_1"]
cosmwasm_2_2 = ["cosmwasm_2_1", "cosmwasm-std/cosmwasm_2_2"]
cosmwasm_3_0 = ["cosmwasm_2_2", "cosmwasm-std/cosmwasm_3_0"]

[dependencies]
cosmos_sdk_proto  =  { package = "cosmos-sdk-proto", version =  "0.28.0", git = "https://github.com/permissionlessweb/cosmos-rust" }
bech32 = "0.11.0"
cosmwasm-schema = "3.0.0"
cosmwasm-std = "3.0.1"
cw-storage-plus = "3.0.0"
cw-utils = { path = "../cw-minus/packages/cw-utils" }
derivative = "2.2.0"
itertools = "0.13.0"
prost = "0.14.1"
schemars = "0.8.4"
serde = "1.0.210"
sha2 = "0.10.8"
thiserror = "1.0.64"
serde_json = "1.0.40"
log = "0.4.20"
hex = "0.4.3"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
tokio   = { version = "1.39.0" }
tonic   = { version = "0.14.1" }

## Emulation
cosmwasm-vm = { version = "=3.0.0", features = [
    "staking",
    "stargate",
    "iterator",
] }

## Dual Storage
cosmrs =  { path = "../cosmos-rust/cosmrs" }
cw20-ics20 = { path = "../cw-plus/contracts/cw20-ics20" }
cw-orch = { version = "0.30.0", features = ["daemon"], git = "https://github.com/permissionlessweb/cw-orchestrator" }
num-bigint = "0.4.3"

# Analyzer
treediff = { version = "4.0.2", features = ["with-rustc-serialize"] }
rustc-serialize = "0.3.24"
wasmer = { version = "=5.0.6", default-features = false, features = [
    "cranelift",
    "singlepass",
] }

# Caching
cargo_metadata = "0.18" # For finding Cargo target dir
file-lock = "2.1"


[dev-dependencies]
hex = "0.4.3"
hex-literal = "0.4.1"
once_cell = "1.20.2"
# general
env_logger = "0.10.0"
 
# Cavern Test App
moneymarket = { git = "https://github.com/CavernPerson/money-market-contracts" }
cw20  =  { path = "../cw-plus/packages/cw20" }
cw2 =  { path = "../cw-minus/packages/cw2" }